seed: 42
image_size: 352
group_size: 5
num_workers: 4

model:
  resnet_pretrained: true
  vit_dim: 384
  vit_depth: 6
  vit_heads: 6
  vit_patch: 16
  feature_dim: 64
  guidance_dim: 64
  diffusion_base_channels: 32

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

training:
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0005
  lambda_saliency: 1.0
  lambda_cosaliency: 1.0
  lambda_diffusion: 0.5
  lambda_refinement: 1.0
  grad_clip: 1.0
  amp: true
  log_interval: 20

paths:
  output_dir: runs/diffcosod
